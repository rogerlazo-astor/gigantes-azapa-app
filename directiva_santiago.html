<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directiva · Santiago Manager</title><script src="config.js"></script><script src="form-bridge.js"></script>
<style>body{font-family:Arial;margin:0;background:#0f172a;color:#fff}main{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;color:#111;border-radius:14px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k{background:#f8fafc;border-radius:10px;padding:13px}.k b{font-size:22px;color:#f36b21;display:block}label{display:block;font-weight:bold;margin:8px 0}input{width:100%;padding:9px;box-sizing:border-box}.btn{background:#f36b21;color:#fff;border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><a class="btn" href="index.html">← Inicio</a><h1>🔐 Panel Directiva · Santiago</h1><p>Solo datos agregados del fondo solidario; no publicar nombres de niños/familias.</p>
<div class="card"><h2>Actualizar presupuesto</h2><form id="f"><div class="grid"><label>Viajeros<input name="viajeros" type="number" min="0"></label><label>Alojamiento persona/noche<input name="alojamiento_noche" type="number" min="0"></label><label>Alimentación persona/día<input name="alimentacion_dia" type="number" min="0"></label><label>Traslados total<input name="traslados" type="number" min="0"></label><label>N° niños que requieren apoyo<input name="ninos_apoyo" type="number" min="0"></label><label>Apoyo promedio pasaje<input name="apoyo_promedio" type="number" min="0"></label></div><button class="btn">Actualizar</button></form></div>
<div class="card"><h2>Control</h2><div id="stats" class="grid"></div></div></main>
<script>const API=window.GIGANTES_APPS_SCRIPT_URL||'',money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);function jsonp(p){return new Promise((r,j)=>{const c='g'+Date.now(),s=document.createElement('script');window[c]=d=>{r(d);delete window[c];s.remove()};p.callback=c;s.src=API+'?'+new URLSearchParams(p);s.onerror=j;document.body.appendChild(s)})}
async function load(){const d=await jsonp({action:'santiago_dashboard'});stats.innerHTML=`<div class=k>Viaje en<b>${d.dias_para_viaje} días</b></div><div class=k>Meta<b>${money(d.meta)}</b></div><div class=k>Recaudado<b>${money(d.recaudado)}</b></div><div class=k>Falta<b>${money(d.faltante)}</b></div><div class=k>Viajeros<b>${d.presupuesto.viajeros}</b></div><div class=k>Actividades<b>${d.actividades.length}</b></div>`}
f.onsubmit=async e=>{e.preventDefault();const q=Object.fromEntries(new FormData(f));q.type='presupuesto_santiago';q.action=q.type;const d=await jsonp(q);alert(d?.message||'Actualizado');await load()};load();</script></body></html>
