<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gigantes Gestión</title>
<style>
:root{--o:#f36b21;--d:#0b0f14;--m:#6b7280;--l:#e5e7eb;--s:#f6f7f9}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--s);color:#111827}aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--d);color:white;padding:20px 14px}.brand{font-weight:900;font-size:19px;padding:8px 10px 22px}.brand small{display:block;color:#94a3b8;font-size:11px;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1f2937;color:white}.main{margin-left:240px}.top{height:82px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:14px 24px;position:sticky;top:0}.top h1{margin:0;font-size:21px}.top p{margin:4px 0 0;color:var(--m);font-size:12px}.top .actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:white}.secondary{background:white;border:1px solid var(--l)}main{padding:22px 24px}.notice{background:#fff7ed;border-left:4px solid var(--o);padding:12px;border-radius:8px;color:#7c2d12;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card,.panel{background:white;border:1px solid var(--l);border-radius:13px}.card{padding:17px}.card span{font-size:11px;color:var(--m);text-transform:uppercase;font-weight:800}.card b{display:block;font-size:28px;margin:7px 0}.panel{padding:17px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 4px}.panel>p{font-size:12px;color:var(--m);margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 110px 90px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #f0f1f3}.name{font-weight:800}.meta{font-size:11px;color:var(--m);margin-top:3px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.info{background:#dbeafe;color:#1e40af}.danger{background:#fee2e2;color:#991b1b}.progress{height:8px;background:#eef0f3;border-radius:99px;margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;background:var(--o)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{border:1px solid var(--l);border-radius:10px;padding:13px}.mini strong{display:block}.mini small{color:var(--m)}.hide{display:none}@media(max-width:800px){aside{width:72px}.brand{font-size:0}.brand:before{content:"G";font-size:24px;background:var(--o);padding:8px 11px;border-radius:10px}.brand small,.nav button span{display:none}.main{margin-left:72px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 90px}.row>*:nth-child(3){display:none}.top{padding:12px}.top .secondary{display:none}main{padding:14px}}
</style>
</head>
<body>
<aside><div class="brand">Gigantes Gestión<small>Club de Rugby · Arica</small></div><div class="nav" id="nav"></div></aside>
<div class="main"><div class="top"><div><h1 id="title">Centro de Control</h1><p id="sub">Vista ejecutiva del club</p></div><div class="actions"><button class="btn secondary" onclick="backup()">Respaldar</button><button class="btn primary" onclick="newTask()">+ Tarea</button></div></div><main id="app"></main></div>
<script>
const K='gigantes_gestion_demo_v1';
const seed={projects:[['Copa FUFY 2026',62,'En ejecución'],['Gira Santiago 2026',48,'En ejecución'],['Chile Rugby · Desarrollo Arica',30,'En preparación'],['Compromiso Joven · Camarones',55,'En ejecución'],['Regularización DS22 / IND',72,'Seguimiento']],tasks:[['Consolidar Registro Maestro único','Chile Rugby · Desarrollo Arica','Alta','2026-09-30'],['Cruzar nómina con base Chile Rugby','Chile Rugby · Desarrollo Arica','Alta','2026-10-02'],['Definir bases vigentes Copa FUFY','Copa FUFY 2026','Alta','2026-09-26'],['Actualizar participantes Gira Santiago','Gira Santiago 2026','Alta','2026-09-28']],docs:[['Estatuto Gigantes Azapa IND','OFICIAL'],['Certificado de Vigencia','OFICIAL'],['Registro Maestro 2026','EN REVISIÓN'],['Base Oficial Chile Rugby','OFICIAL'],['Bases Copa FUFY V1.1','VIGENTE'],['Manual FUFY antiguo','OBSOLETO']]};
let db=JSON.parse(localStorage.getItem(K)||'null')||seed;
const pages=[['dash','▦','Centro de Control','Vista ejecutiva del club'],['personas','👥','Personas','Registro Maestro del club'],['proyectos','🏆','Proyectos','Copa FUFY, giras y desarrollo'],['tareas','✓','Tareas','Responsables y fechas'],['docs','📄','Documentos','Vigentes, revisión e históricos'],['chile','🇨🇱','Chile Rugby','Jugadores, seguros y desarrollo'],['finanzas','💰','Finanzas','Recaudación y sponsors']];
let route='dash';
nav.innerHTML=pages.map(p=>'<button data-r="'+p[0]+'">'+p[1]+' <span>'+p[2]+'</span></button>').join('');
nav.onclick=e=>{let b=e.target.closest('button');if(!b)return;route=b.dataset.r;render()};
function badge(t){let c=/OFICIAL|VIGENTE/.test(t)?'ok':/OBSOLETO/.test(t)?'danger':/REVIS|PREPAR/.test(t)?'warn':'info';return '<span class="badge '+c+'">'+t+'</span>'}
function projectRows(){return db.projects.map(p=>'<div class="row"><div><div class="name">'+p[0]+'</div><div class="progress"><i style="width:'+p[1]+'%"></i></div></div><div>'+badge(p[2])+'</div><b>'+p[1]+'%</b></div>').join('')}
function taskRows(){return db.tasks.map(t=>'<div class="row"><div><div class="name">'+t[0]+'</div><div class="meta">'+t[1]+'</div></div><div>'+badge(t[2])+'</div><div>'+t[3]+'</div></div>').join('')}
function view(){
 if(route==='dash')return '<div class="notice">Piloto seguro: no contiene RUT, teléfonos, fichas médicas ni documentos personales. Primero validamos el sistema; luego conectamos la base real.</div><div class="kpis"><div class="card"><span>Miembros</span><b>—</b><small>Registro Maestro</small></div><div class="card"><span>Jugadores</span><b>—</b><small>M10 · M12 · M14 · Classic</small></div><div class="card"><span>Proyectos</span><b>'+db.projects.length+'</b><small>Activos</small></div><div class="card"><span>Duplicados</span><b>5</b><small>Detectados en auditoría</small></div></div><div class="grid"><div class="panel"><h2>Proyectos prioritarios</h2><p>Estado consolidado del club</p>'+projectRows()+'</div><div class="panel"><h2>Auditoría Drive</h2><p>Principales hallazgos</p><div class="grid"><div class="mini"><strong>1 fuente oficial</strong><small>por cada documento</small></div><div class="mini"><strong>Histórico</strong><small>sin borrar primero</small></div><div class="mini"><strong>Chile Rugby</strong><small>nuevo módulo institucional</small></div><div class="mini"><strong>Alertas</strong><small>pendientes y vencimientos</small></div></div></div></div><div class="panel"><h2>Tareas críticas</h2><p>Lo primero que debe cerrarse</p>'+taskRows()+'</div>';
 if(route==='proyectos')return '<div class="panel"><h2>Portafolio de proyectos</h2><p>Cada proyecto tendrá responsable, avance, documentos y tareas.</p>'+projectRows()+'</div>';
 if(route==='tareas')return '<div class="panel"><h2>Gestión de tareas</h2><p>Responsables, fechas y prioridad.</p>'+taskRows()+'</div>';
 if(route==='docs')return '<div class="panel"><h2>Control documental</h2><p>Una sola versión vigente. El resto se clasifica.</p>'+db.docs.map(d=>'<div class="row"><div class="name">'+d[0]+'</div><div>'+badge(d[1])+'</div><div></div></div>').join('')+'</div>';
 if(route==='chile')return '<div class="kpis"><div class="card"><span>Base oficial</span><b>✓</b><small>Chile Rugby</small></div><div class="card"><span>Seguros</span><b>↔</b><small>Por conciliar</small></div><div class="card"><span>Colegios</span><b>+</b><small>Más que Rugby</small></div><div class="card"><span>Capacitación</span><b>+</b><small>Arica</small></div></div><div class="panel"><h2>Chile Rugby</h2><p>Jugadores y seguros · Más que Rugby · Copa FUFY · Capacitaciones y desarrollo.</p></div>';
 if(route==='personas')return '<div class="panel"><h2>Registro Maestro</h2><p>Una persona = un registro único. Roles: jugador, apoderado, entrenador, directiva y colaborador.</p><div class="notice">La interfaz ya está preparada. Los datos personales reales se conectarán únicamente con autenticación.</div></div>';
 return '<div class="panel"><h2>Finanzas</h2><p>Recaudación, caja, rendiciones, sponsors y actividades.</p><div class="notice">En GitHub público sólo se mostrarán indicadores autorizados; nunca datos bancarios o privados.</div></div>';
}
function render(){let m=pages.find(p=>p[0]===route);title.textContent=m[2];sub.textContent=m[3];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.r===route));app.innerHTML=view()}
function newTask(){let t=prompt('Nueva tarea');if(!t)return;db.tasks.unshift([t,'General','Media','Sin fecha']);localStorage.setItem(K,JSON.stringify(db));route='tareas';render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='gigantes-gestion-backup.json';a.click()}
render();
</script>
</body></html>
