<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupos A–D · Gigantes</title><script src="config.js"></script><script src="form-bridge.js"></script>
<style>body{margin:0;font-family:Arial;background:#f4f5f7;color:#111}main{max-width:1050px;margin:auto;padding:20px}.head{background:#111827;color:#fff;padding:26px;border-radius:16px}.head em{color:#f36b21;font-style:normal}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px}.card b.big{font-size:32px;color:#f36b21}.form{background:#fff;border-radius:14px;padding:18px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:bold;font-size:13px}input,select,textarea{display:block;width:100%;padding:10px;margin-top:4px;border:1px solid #ccd;border-radius:8px;box-sizing:border-box}.checks{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.checks label{font-weight:normal}.checks input{display:inline;width:auto}.btn{background:#f36b21;color:#fff;border:0;padding:11px 17px;border-radius:9px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.nav{margin-bottom:12px}.nav a{margin-right:8px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.fg{grid-template-columns:1fr}}</style></head>
<body><main><div class="nav"><a class="btn" href="index.html">← Inicio</a><a class="btn" href="santiago.html">✈️ Santiago</a></div>
<div class="head"><h1>Grupos de trabajo <em>A–D</em></h1><p>Una persona se registra una sola vez. La app recuerda disponibilidad y habilidades.</p></div><div class="grid" id="groupGrid"></div>
<div class="form"><h2>🙋 Integrarme a un grupo</h2><form id="f"><div class="fg"><label>Grupo<select name="grupo"><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
<label>Nombre / familia<input name="nombre" required></label><label>WhatsApp<input name="telefono" required></label><label>Rol principal<select name="rol_principal"><option>Coordinación</option><option>Caja</option><option>Cocina</option><option>Armado</option><option>Venta / entrega</option><option>Montaje</option><option>Aseo</option><option>Donaciones</option></select></label>
<label>Rol secundario<select name="rol_secundario"><option></option><option>Caja</option><option>Cocina</option><option>Armado</option><option>Venta / entrega</option><option>Montaje</option><option>Aseo</option><option>Donaciones</option></select></label></div>
<div class="checks"><label><input type="checkbox" name="martes" value="1"> Martes</label><label><input type="checkbox" name="jueves" value="1"> Jueves</label><label><input type="checkbox" name="dona" value="1"> Donar insumos</label><label><input type="checkbox" name="caja" value="1"> Caja</label><label><input type="checkbox" name="cocina" value="1"> Cocina</label><label><input type="checkbox" name="montaje" value="1"> Montaje/aseo</label></div>
<label>Observaciones<textarea name="observaciones"></textarea></label><button class="btn">Guardar</button></form></div></main>
<script>
const API=window.GIGANTES_APPS_SCRIPT_URL||'';function jsonp(p){return new Promise((r,j)=>{const c='g'+Date.now(),s=document.createElement('script');window[c]=d=>{r(d);delete window[c];s.remove()};p.callback=c;s.src=API+'?'+new URLSearchParams(p);s.onerror=j;document.body.appendChild(s)})}
async function load(){const d=await jsonp({action:'grupos_santiago'});groupGrid.innerHTML=['A','B','C','D'].map(g=>`<div class="card"><b class="big">${d.groups[g].length}</b><h2>Grupo ${g}</h2><small>Meta: ${d.objetivo_por_grupo}</small>${d.groups[g].map(x=>`<p><b>${x.nombre}</b><br><small>${x.rol}</small></p>`).join('')}</div>`).join('')}
f.onsubmit=async e=>{e.preventDefault();const q=Object.fromEntries(new FormData(f));q.type='grupo_santiago';q.action=q.type;const d=await jsonp(q);alert(d?.message||'Guardado');f.reset();await load()};load();
</script></body></html>
